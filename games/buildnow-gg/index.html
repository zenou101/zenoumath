<html lang="en-us"><head>
  <base href="https://cdn.jsdelivr.net/gh/bubblfan/cg-rip@main/buildnow-gg/">
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>BuildNow GG</title>
  <style>html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#fff}.noselect{user-select:none;-webkit-user-select:none}#loading-text{position:fixed;inset:0 0 auto 0;z-index:2;color:#111;font-size:clamp(24px,4vw,48px);font-family:cursive;text-align:center;margin-top:20px;pointer-events:none}#unity-canvas{position:fixed;top:0;left:0;width:100%;height:100%;outline:none;display:block}</style>
</head>
<body class="noselect">
  <div id="loading-text" role="status">Loading BuildNow GG…</div>
  <canvas id="unity-canvas" tabindex="-1" width="1244" height="811" style="width: 1244px; height: 811px; cursor: default;"></canvas>
  <script>
    const buildBase = new URL("Build/", document.baseURI);
    const loading = document.getElementById("loading-text");

    async function resolveBuildFile(file, type) {
      const url = new URL(file, buildBase).href;
      const parts = [];
      for (let index = 1; index <= 99; index++) {
        const partUrl = url + ".part" + index;
        const response = await fetch(partUrl, { method: "HEAD" });
        if (response.status === 404) break;
        if (!response.ok) throw new Error("The game host returned HTTP " + response.status + ".");
        parts.push(partUrl);
      }
      if (!parts.length) return url;

      const buffers = await Promise.all(parts.map(async partUrl => {
        const response = await fetch(partUrl);
        if (!response.ok) throw new Error("Could not download a game file (HTTP " + response.status + ").");
        return response.arrayBuffer();
      }));
      return URL.createObjectURL(new Blob(buffers, { type }));
    }

    function showLoadError(error) {
      document.body.dataset.gameLoadError = "true";
      document.getElementById("loading-text").textContent = "BuildNow GG couldn’t start. Reload to try again.";
      if (parent !== window) parent.postMessage({type:"zenou:game-load-error"}, location.origin);
      console.error(error);
    }
    async function start() {
      loading.textContent = "Downloading game data…";
      const dataUrl = await resolveBuildFile("ab8dd356a41a2943639294657a0990f8.data", "application/octet-stream");
      loading.textContent = "Downloading game engine…";
      const codeUrl = await resolveBuildFile("7db022abd161455e3cc5f207e75d294b.wasm", "application/wasm");
      const loaderUrl = new URL("7a2dbded24d57e056180125b1583e7c4.loader.js", buildBase);
      const frameworkUrl = new URL("91a2bfcec140bc524100478b99a4f6d7.framework.js", buildBase);
      await new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = loaderUrl.href;
        script.onload = resolve;
        script.onerror = () => reject(new Error("Could not open the game loader."));
        document.body.append(script);
      });
      const config = {
        dataUrl,
        codeUrl,
        frameworkUrl: frameworkUrl.href,
        streamingAssetsUrl: new URL("StreamingAssets/", document.baseURI).href,
        companyName: "BuildNow GG",
        productName: "BuildNow GG",
        productVersion: "1.0.0",
      };
      const canvas = document.querySelector("#unity-canvas");
      window.gameInstance = await createUnityInstance(canvas, config, progress => {
        loading.textContent = "Starting BuildNow GG… " + Math.floor(progress * 100) + "%";
      });
      loading.hidden = true;
    }
    start().catch(showLoadError);

    function resizeCanvas(){const c=document.getElementById("unity-canvas");c.width=window.innerWidth;c.height=window.innerHeight;c.style.width=window.innerWidth+"px";c.style.height=window.innerHeight+"px"}
    addEventListener("load",resizeCanvas);addEventListener("resize",resizeCanvas);
  </script>

<div id="local-overlay" style="position: fixed; display: none; inset: 0px; font-family: Arial, Helvetica, sans-serif; color: white; align-items: center; justify-content: center; background-color: rgba(0, 0, 0, 0.75); z-index: 10000;"></div></body></html>
