    <div id="loading-text" role="status">Checking the game build…</div>
    <div id="unity-loading-bar"><div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div></div>
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"
      integrity="sha384-DT0Ls0mO7JmjTnT+oBuMhEJzYJO1zUqzuuMXNdnOmOQRIpN2BgSjvBV/j50NngIT" crossorigin="anonymous"></script>
    <script>
      const buildRoot = new URL(document.baseURI);
      const streamingRoot = new URL('StreamingAssets/', buildRoot);
      const webglRoot = new URL('aa/WebGL/', streamingRoot);
      const cacheName = 'hksilksongcache-bcbe0147-v3';
      const completeKey = new URL('__zenou_complete__', webglRoot).href;
      const partCount = 100;
      const loadingText = document.querySelector('#loading-text');
      const loadingBar = document.querySelector('#unity-loading-bar');
      const progressBar = document.querySelector('#unity-progress-bar-full');
      const warningBanner = document.querySelector('#unity-warning');
      const originalFetch = window.fetch.bind(window);

      function loadUnity() {
        return new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = new URL('Build/w-pt.loader.js', buildRoot).href;
          script.onload = () => {
            if (typeof createUnityInstance === 'function') resolve();
            else reject(new Error('The Unity loader did not initialize.'));
          };
          script.onerror = () => reject(new Error('The game host did not return the Unity loader.'));
          document.body.append(script);
        });
      }

      async function downloadAssets(cache) {
        const writes = [];
        let extractionError;
        let fileCount = 0;
        const archive = new fflate.Unzip(file => {
          const directory = file.name.endsWith('/');
          const segments = file.name.split('/');
          if (segments.some(segment => segment === '..')) {
            throw new Error('The game archive contains an unexpected file path.');
          }
          const key = new URL(segments.map(encodeURIComponent).join('/'), webglRoot).href;
          const chunks = [];
          file.ondata = (error, chunk, final) => {
            if (error) { extractionError = error; return; }
            if (directory) return;
            chunks.push(chunk);
            if (final) {
              fileCount++;
              const blob = new Blob(chunks, { type: 'application/octet-stream' });
              chunks.length = 0;
              writes.push(cache.put(key, new Response(blob)));
            }
          };
          file.start();
        });
        archive.register(fflate.UnzipInflate);

        async function push(chunk, final = false) {
          try {
            archive.push(chunk, final);
          } finally {
            await Promise.all(writes.splice(0));
          }
          if (extractionError) throw extractionError;
        }

        for (let part = 1; part <= partCount; part++) {
          loadingText.textContent = `Preparing game files… ${part} / ${partCount} (about 2 GB on first launch)`;
          const url = new URL(`aa/WebGL.zip.part${part}`, streamingRoot);
          const response = await originalFetch(url);
          if (!response.ok || !response.body) {
            throw new Error(`The game host could not supply download part ${part} (HTTP ${response.status}).`);
          }
          const reader = response.body.getReader();
          try {
            while (true) {
              const { value, done } = await reader.read();
              if (done) break;
              await push(value);
            }
          } catch (error) {
            await reader.cancel().catch(() => {});
            throw error;
          } finally {
            reader.releaseLock();
          }
        }
        await push(new Uint8Array(), true);
        if (!fileCount) throw new Error('No game files were extracted.');
        await cache.put(completeKey, new Response('ok'));
      }

      async function prepareAssetCache() {
        const existing = await caches.open(cacheName);
        if (await existing.match(completeKey)) return existing;
        await caches.delete('hksilksongcache-v2');
        await caches.delete(cacheName);
        const cache = await caches.open(cacheName);
        try {
          await downloadAssets(cache);
          return cache;
        } catch (error) {
          await caches.delete(cacheName).catch(() => {});
          throw error;
        }
      }

      function showUnityBanner(message, type) {
        const notice = document.createElement('div');
        notice.textContent = message;
        notice.setAttribute('role', type === 'error' ? 'alert' : 'status');
        warningBanner.append(notice);
        warningBanner.style.display = 'block';
        if (type !== 'error') {
          setTimeout(() => {
            notice.remove();
            if (!warningBanner.childElementCount) warningBanner.style.display = 'none';
          }, 5000);
        }
      }

      async function boot() {
        if (!window.fflate) throw new Error('The asset unpacker could not load. Check your connection or content blocker.');
        if (!window.caches) throw new Error('This browser does not provide the storage needed for the game files.');
        await loadUnity();
        const cache = await (navigator.locks
          ? navigator.locks.request(cacheName, prepareAssetCache)
          : prepareAssetCache());

        window.fetch = async (resource, options) => {
          const url = new URL(resource instanceof Request ? resource.url : resource, buildRoot);
          if (url.href.startsWith(webglRoot.href)) {
            const response = await cache.match(url.href, { ignoreSearch: true });
            if (response) return response;
          }
          return originalFetch(resource, options);
        };

        loadingText.textContent = 'Starting Silksong…';
        loadingBar.style.display = 'block';
        await createUnityInstance(document.querySelector('#unity-canvas'), {
          dataUrl: new URL('Build/w-pt.data.unityweb', buildRoot).href,
          frameworkUrl: new URL('Build/w-pt.framework.js.unityweb', buildRoot).href,
          codeUrl: new URL('Build/w-pt.wasm.unityweb', buildRoot).href,
          streamingAssetsUrl: streamingRoot.href.replace(/\/$/, ''),
          companyName: 'EDUrocks Group, Truffled, GN-Math',
          productName: 'Hollow Knight SilkSong',
          productVersion: '1.0',
          showBanner: showUnityBanner,
        }, progress => { progressBar.style.width = `${Math.round(progress * 100)}%`; });

        loadingBar.remove();
        loadingText.remove();
      }

      boot().catch(error => {
        console.error(error);
        loadingBar.style.display = 'none';
        const reason = error.name === 'QuotaExceededError'
          ? 'Your browser ran out of space for the game files.'
          : error.message;
        loadingText.textContent = `Silksong couldn’t start. ${reason} Reload the game to try again.`;
      });
    </script>
