<html lang="en"><head><base href="https://cdn.jsdelivr.net/gh/web-ports/terraria@main/">
	

		<meta charset="UTF-8">
		<link rel="icon" href="./app.ico">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta property="og:title" content="Terrarium">
		<meta property="og:description" content="Terraria port for WebAssembly. Play Terraria online in the browser.">
		<meta name="description" content="Terraria port for WebAssembly. Play Terraria online in the browser.">
		<style>body,html{background:#101214;margin:0;padding:0;width:100%;height:100%;overflow:hidden}#game-container,canvas,iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;display:block}#game-status{position:fixed;inset:0;z-index:1;display:grid;place-items:center;margin:0;padding:24px;color:#edf2fa;font:500 15px/1.6 system-ui,sans-serif;text-align:center;pointer-events:none}</style>
		<link rel="canonical" href="https://terraria.mercurywork.shop">
		<title>Terraria</title>

	</head>

	<body>
		<div id="app"></div>
		<canvas id="canvas" style="width: 100%; cursor: none;" width="1920" height="1080">

		</canvas>
	
  <p id="game-status" role="status">Loading Terraria…</p>
  <script type="module">
    const status = document.getElementById('game-status');
    try {
      await import(new URL('main.js', document.baseURI).href);
      status.remove();
    } catch {
      status.textContent = 'Terraria could not load its game files. Reload the page to try again.';
      document.body.dataset.gameLoadError = 'true';
      if (parent !== window) parent.postMessage({ type: 'zenou:game-load-error' }, location.origin);
    }
  </script>
</body></html>
